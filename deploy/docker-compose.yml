services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kyzx_root_pass
      MYSQL_DATABASE: kaoyan_zexiao
      MYSQL_USER: kyzx
      MYSQL_PASSWORD: kyzx_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init.sql:/docker-entrypoint-initdb.d/0_init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukyzx", "-pkyzx_dev_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: kyzx
      DB_PASSWORD: kyzx_dev_pass
      DB_NAME: kaoyan_zexiao
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change_me_to_strong_random_at_least_32_bytes
      WECHAT_APP_ID: change_me
      WECHAT_APP_SECRET: change_me
      DEBUG: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 生产：./cert.pem / ./cert.key 挂到 /etc/nginx/ssl/
      # - ./cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./cert.key:/etc/nginx/ssl/cert.key:ro

volumes:
  mysql_data:
  redis_data:
